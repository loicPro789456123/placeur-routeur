[package]
name = "placeur_routage"
version = "2.0.0"
edition = "2021"
description = "Moteur generique de placement et de routage de circuits imprimes"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[features]
# construction de controle sans le cache exact du test de via (avenant 2.2, A.4-1, test (a) entre executables)
sans_cache_via = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
# panique deroulee : attrapee par catch_unwind autour de l'execution (code de sortie 4, contrat §1.4)
panic = "unwind"
