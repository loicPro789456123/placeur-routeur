[package]
name = "serigraphie"
version = "2.0.0"
edition = "2021"
description = "Placement autonome de la serigraphie (designateurs, rognage des traits) apres routage, pour toute carte"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
